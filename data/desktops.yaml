   packages: ["openbox", "tint2", "obconf", "pcmanfm", "feh", "lxappearance"],
   preview: {layout: minimal, accent: "#6FA8DC", wall: ["#1C1C28", "#34345A"]}}
- {id: fluxbox, name: "Fluxbox", type: "X11", dm: sddm,
