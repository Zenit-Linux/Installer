# Katalog środowisk graficznych Zenit Linux.
# Pola: id, name, desc, session, type, dm, packages, recommends, placeholder,
#       bases (dozwolone bazy; domyślnie wszystkie), preview{layout,accent,wall,bar}
# Układy podglądu: panel-bottom | gnome | top-dock | top-bottom | tiling | minimal
desktops:
- {id: plasma, name: "KDE Plasma", type: "X11 + Wayland", dm: sddm, recommends: true,
   desc: "Nowoczesne, w pełni konfigurowalne środowisko. Domyślny wybór Zenit Linux.",
   packages: ["pattern:kde_plasma"],
   preview: {layout: panel-bottom, accent: "#3DAEE9", wall: ["#1B2A49", "#6A3C8F"]}}
- {id: gnome, name: "GNOME", type: "Wayland + X11", dm: gdm, recommends: true,
   desc: "Minimalistyczny, nowoczesny pulpit z widokiem Activities.",
   packages: ["pattern:gnome_basic"],
   preview: {layout: gnome, accent: "#3584E4", wall: ["#2B3A67", "#C06C84"]}}
- {id: xfce, name: "Xfce", type: "X11", dm: sddm,
   desc: "Lekki, stabilny i szybki pulpit w klasycznym układzie.",
   packages: ["pattern:xfce_basic"],
   preview: {layout: top-bottom, accent: "#2E9AD6", wall: ["#16324F", "#2A7F8E"]}}
- {id: wayfire, name: "Wayfire", type: "Wayland", dm: sddm,
   desc: "Kompozytor Wayland w stylu Compiza: efekty, animacje, wtyczki.",
   packages: ["wayfire", "wcm", "wf-shell", "foot", "wofi"], bases: [tumbleweed, slowroll],
   preview: {layout: top-dock, accent: "#E0A526", wall: ["#10243F", "#7B2D6B"]}}
- {id: cosmic, name: "COSMIC", type: "Wayland", dm: sddm,
   desc: "Nowe środowisko System76 napisane w Rust. Kafelkowanie i klasyczny pulpit.",
   packages: ["pattern:cosmic", "cosmic-session", "cosmic-comp", "cosmic-panel", "cosmic-settings", "cosmic-applets"],
   bases: [tumbleweed, slowroll],
   preview: {layout: top-dock, accent: "#63D0DF", wall: ["#101820", "#3B2A5A"]}}
- {id: lxde, name: "LXDE", type: "X11", dm: sddm,
   desc: "Ultralekki pulpit dla starszych komputerów.",
   packages: ["pattern:lxde"],
   preview: {layout: panel-bottom, accent: "#5C9E31", wall: ["#2C3E50", "#4CA1AF"]}}
- {id: lxqt, name: "LXQt", type: "X11 + Wayland", dm: sddm,
   desc: "Lekkie środowisko oparte na Qt – szybkie i oszczędne.",
   packages: ["pattern:lxqt"],
   preview: {layout: panel-bottom, accent: "#4CA3DD", wall: ["#232F3E", "#5B86E5"]}}
- {id: blue, name: "Blue Environment", type: "Wkrótce", dm: sddm, placeholder: true,
   desc: "Własne środowisko Zenit Linux – w przygotowaniu. Placeholder.",
   packages: [],
   preview: {layout: top-dock, accent: "#2F6BFF", wall: ["#0A1B4D", "#2F6BFF"]}}
- {id: mate, name: "MATE", type: "X11", dm: sddm,
   desc: "Klasyczny pulpit w tradycji GNOME 2.",
   packages: ["pattern:mate_basis"],
   preview: {layout: top-bottom, accent: "#87A752", wall: ["#2D4A3E", "#7A9E7E"]}}
- {id: cinnamon, name: "Cinnamon", type: "X11", dm: sddm,
   desc: "Elegancki, tradycyjny pulpit znany z Linux Mint.",
   packages: ["cinnamon", "cinnamon-session", "cinnamon-control-center", "nemo", "cinnamon-screensaver"],
   preview: {layout: panel-bottom, accent: "#9AC15E", wall: ["#273B2E", "#5E8F6D"]}}
- {id: budgie, name: "Budgie", type: "X11 + Wayland", dm: sddm,
   desc: "Prosty i elegancki pulpit z panelem i widokiem Raven.",
   packages: ["budgie-desktop", "budgie-desktop-view", "budgie-control-center"], bases: [tumbleweed, slowroll],
   preview: {layout: top-dock, accent: "#5294E2", wall: ["#1F2B47", "#4E6FAE"]}}
- {id: enlightenment, name: "Enlightenment", type: "X11 + Wayland", dm: sddm,
   desc: "Efektowny i bardzo oszczędny menedżer okien z półką (Shelf).",
   packages: ["pattern:enlightenment"],
   preview: {layout: minimal, accent: "#4CC9F0", wall: ["#0B132B", "#3A506B"]}}
- {id: sway, name: "Sway", type: "Wayland", dm: sddm,
   desc: "Kafelkowy kompozytor Wayland zgodny z i3.",
   packages: ["sway", "waybar", "foot", "wofi", "swaylock", "swayidle", "swaybg", "grim", "slurp", "mako"],
   preview: {layout: tiling, bar: top, accent: "#4C7899", wall: ["#101418", "#26333F"]}}
