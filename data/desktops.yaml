   packages: ["i3", "i3status", "i3lock", "dmenu", "rofi", "feh", "picom", "alacritty"],
   preview: {layout: tiling, bar: bottom, accent: "#E8E8E8", wall: ["#111111", "#2B2B2B"]}}
- {id: openbox, name: "Openbox", type: "X11", dm: sddm,
