   packages: ["fluxbox", "pcmanfm", "feh"],
   preview: {layout: minimal, accent: "#3F8FD6", wall: ["#102A43", "#486581"]}}
- {id: icewm, name: "IceWM", type: "X11", dm: sddm,
   desc: "Lekki menedżer okien w stylu klasycznych pulpitów.",
   packages: ["icewm", "pcmanfm"],
   preview: {layout: panel-bottom, accent: "#7AA2C9", wall: ["#2F3E52", "#5D7B99"]}}
- {id: jwm, name: "JWM", type: "X11", dm: sddm,
   desc: "Joe's Window Manager – bardzo mały i szybki.",
   packages: ["jwm", "pcmanfm", "feh"],
   preview: {layout: panel-bottom, accent: "#C98A3B", wall: ["#2B2118", "#59432C"]}}
- {id: awesome, name: "Awesome", type: "X11", dm: sddm,
   desc: "Kafelkowy menedżer okien konfigurowany w Lua.",
   packages: ["awesome", "rofi", "feh", "picom", "alacritty"],
   preview: {layout: tiling, bar: top, accent: "#5FA8D3", wall: ["#0D1B2A", "#1B3A57"]}}
- {id: bspwm, name: "bspwm", type: "X11", dm: sddm,
   desc: "Kafelkowy menedżer okien oparty na drzewie binarnym.",
   packages: ["bspwm", "sxhkd", "polybar", "rofi", "feh", "picom", "alacritty"],
   preview: {layout: tiling, bar: top, accent: "#D96C75", wall: ["#161320", "#3A2E4F"]}}
- {id: qtile, name: "Qtile", type: "X11 + Wayland", dm: sddm,
   desc: "Kafelkowy menedżer okien w całości napisany i konfigurowany w Pythonie.",
   packages: ["qtile", "rofi", "feh", "alacritty"], bases: [tumbleweed, slowroll],
   preview: {layout: tiling, bar: bottom, accent: "#4AA3A2", wall: ["#0F2027", "#2C5364"]}}
- {id: labwc, name: "Labwc", type: "Wayland", dm: sddm,
   desc: "Stosowy kompozytor Wayland inspirowany Openboxem.",
   packages: ["labwc", "waybar", "foot", "wofi", "swaybg"], bases: [tumbleweed, slowroll],
   preview: {layout: minimal, accent: "#8FB6D9", wall: ["#1B2430", "#3D5A80"]}}

# Pakiety pomocnicze doinstalowywane zależnie od typu sesji
common:
  x11: ["xorg-x11-server", "xf86-input-libinput", "xrdb", "xsetroot"]
  wayland: ["xorg-x11-server-Xwayland"]
dm_packages:
  sddm: ["sddm", "sddm-qt6"]
  gdm: ["gdm"]
  lightdm: ["lightdm", "lightdm-gtk-greeter"]
