# Przykład pochodnej: "Zenit Leap" oparty na openSUSE Leap.
# Użycie: ./build.sh derivatives/example-leap.conf   (OUT=dist-leap ./build.sh ... żeby nie nadpisać dist/)
DISTRO_NAME="Zenit Linux Leap"
DISTRO_SHORT="Zenit Leap"
DISTRO_ID="zenit-leap"
DISTRO_VERSION="1.0"
DISTRO_URL="https://zenit-linux.org"
DISTRO_SUPPORT_URL="https://zenit-linux.org/support"
DISTRO_BUGS_URL="https://zenit-linux.org/bugs"
DISTRO_NOTES_URL="https://zenit-linux.org/release-notes"
BASE="leap"
BOOTLOADER_ID="zenit-leap"
LIVE_USER="liveuser"
LIVE_SESSION_FILE="plasma.desktop"
LIVE_SQUASHFS="/run/initramfs/live/LiveOS/squashfs.img"
