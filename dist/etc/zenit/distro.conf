# ============================================================================
#  Zenit Linux – tożsamość dystrybucji (jedyny plik do zmiany w pochodnych)
#  Wczytywany przez build.sh; wartości trafiają do szablonów *.in
#  oraz do /etc/zenit/distro.conf w obrazie.
# ============================================================================
DISTRO_NAME="Zenit Linux"
DISTRO_SHORT="Zenit"
DISTRO_ID="zenit"
DISTRO_VERSION="1.0"
DISTRO_URL="https://zenit-linux.org"
DISTRO_SUPPORT_URL="https://zenit-linux.org/support"
DISTRO_BUGS_URL="https://zenit-linux.org/bugs"
DISTRO_NOTES_URL="https://zenit-linux.org/release-notes"

# Baza openSUSE: tumbleweed | slowroll | leap
# (steruje dostępnością środowisk – patrz pole "bases" w data/desktops.yaml)
BASE="tumbleweed"

# Bootloader / EFI
BOOTLOADER_ID="zenit"

# Live
LIVE_USER="liveuser"
# Plik sesji uruchamiany po wyborze "Tryb live" (z /usr/share/{xsessions,wayland-sessions})
LIVE_SESSION_FILE="plasma.desktop"
# Obraz squashfs z systemem live (dostosuj do Zenit Buildera / kiwi)
LIVE_SQUASHFS="/run/initramfs/live/LiveOS/squashfs.img"
