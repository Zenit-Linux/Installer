---
# Sprzątanie śladów systemu live w zainstalowanym systemie
dontChroot: false
timeout: 120
script:
    - "rm -f /etc/sddm.conf.d/10-zenit-installer.conf /etc/sddm.conf.d/99-zenit-switch.conf"
    - "rm -f /usr/share/xsessions/zenit-installer.desktop /usr/share/applications/zenit-install.desktop"
    - "rm -f /etc/sudoers.d/zenit-live"
    - "rm -rf /etc/zenit/openbox"
    - "rm -f /usr/bin/zenit-installer /usr/bin/zenit-installer-session /usr/bin/zenit-live-chooser /usr/bin/zenit-live-switch"
    - "systemctl set-default graphical.target"
