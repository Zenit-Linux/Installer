---
# Układ subwolumenów zgodny z konwencją openSUSE
extraMounts:
    - device: proc
      fs: proc
      mountPoint: /proc
    - device: sys
      fs: sysfs
      mountPoint: /sys
    - device: /dev
      mountPoint: /dev
      options: [ bind ]
    - device: tmpfs
      fs: tmpfs
      mountPoint: /run
    - device: /run/udev
      mountPoint: /run/udev
      options: [ bind ]
extraMountsEfi:
    - device: efivarfs
      fs: efivarfs
      mountPoint: /sys/firmware/efi/efivars
btrfsSubvolumes:
    - mountPoint: /
      subvolume: /@
    - mountPoint: /home
      subvolume: /@/home
    - mountPoint: /root
      subvolume: /@/root
    - mountPoint: /opt
      subvolume: /@/opt
    - mountPoint: /srv
      subvolume: /@/srv
    - mountPoint: /usr/local
      subvolume: /@/usr/local
    - mountPoint: /var
      subvolume: /@/var
