---
defaultGroups:
    - users
    - wheel
    - video
    - audio
    - render
sudoersGroup:    wheel
setRootPassword: true
doReusePassword: true          # hasło roota = hasło użytkownika (sudo w openSUSE pyta o hasło roota)
doAutologin:     false
userShell:       /bin/bash
passwordRequirements:
    minLength: 4
    maxLength: -1
allowWeakPasswords: true
allowWeakPasswordsDefault: false
hostname:
    location:       EtcFile
    writeHostsFile: true
    forbidden:      [ localhost ]
