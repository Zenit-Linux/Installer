---
services:
    - { name: NetworkManager, action: enable, mandatory: false }
    - { name: bluetooth,      action: enable, mandatory: false }
    - { name: firewalld,      action: enable, mandatory: false }
    - { name: chronyd,        action: enable, mandatory: false }
    - { name: apparmor,       action: enable, mandatory: false }
targets:
    - { name: graphical, action: set-default, mandatory: true }
