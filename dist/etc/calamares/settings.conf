# Zenit Linux – główna konfiguracja Calamares (baza: openSUSE)
---
modules-search: [ local, /usr/lib/calamares/modules ]

# Instancje modułów z własnymi plikami konfiguracji
instances:
- id:       initramfs
  module:   shellprocess
  config:   shellprocess_initramfs.conf
- id:       cleanup
  module:   shellprocess
  config:   shellprocess_cleanup.conf

sequence:
# --- Ekrany widoczne dla użytkownika ---------------------------------------
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - zenitdesktop        # własny ekran QML: wybór środowisk z podglądem
  - summary
# --- Zadania wykonywane podczas instalacji ---------------------------------
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - users
  - networkcfg
  - hwclock
  - packages            # pakiety wspólne (zypper)
  - zenitdesktopjob     # instalacja wybranych środowisk + display manager
  - shellprocess@initramfs
  - bootloader
  - services-systemd
  - shellprocess@cleanup
  - removeuser          # usuwa użytkownika live
  - umount
- show:
  - finished

branding: zenit
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: false
